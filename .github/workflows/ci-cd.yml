name: Production CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

# Cancel in-progress runs on the same branch to prevent stacked deploys.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # JOB 1: FRONTEND — Unit tests & Build
  # ==========================================
  # No TypeScript (plain JSX) and no lint script yet, so the frontend is
  # validated by its node:test unit tests and a production Vite build.
  frontend-ci:
    name: Frontend — Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Node's built-in test runner: no extra packages. The tests import
      # ES-module .js files from src/; package.json has no "type": "module"
      # (postcss.config.js is CommonJS), so this relies on Node's module
      # syntax detection, enabled by default since Node 20.19 / 22.7.
      - name: Unit tests (node:test)
        run: node --test src/__tests__/*.test.mjs

      # Vite build acts as a compilation check (catches bad imports, missing
      # modules, etc.). A dummy VITE_API_BASE_URL prevents build-time errors
      # from the env var being undefined.
      - name: Build (production bundle)
        run: npm run build
        env:
          VITE_API_BASE_URL: https://placeholder.example.com

  # ==========================================
  # JOB 2: BACKEND — Lint & Test
  # ==========================================
  # Tests use an in-memory SQLite DB (see backend/tests/conftest.py),
  # so no PostgreSQL service container is required here.
  backend-ci:
    name: Backend — Lint & Pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            ./backend/requirements.txt
            ./backend/requirements-dev.txt

      # requirements-dev.txt includes requirements.txt plus the pinned
      # test/lint tools (pytest, httpx, pytest-cov, ruff).
      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint with Ruff
        run: ruff check .

      # conftest.py patches the DB engine to SQLite before app import,
      # so no real DATABASE_URL is needed.
      - name: Run Pytest with coverage
        run: pytest --cov=. --cov-report=term-missing -v
        env:
          # Minimal env so the app module loads without errors
          ENVIRONMENT: development
          ALLOWED_HOSTS: localhost,127.0.0.1,testserver
          ALLOWED_ORIGINS: http://testserver

  # ==========================================
  # JOB 3: DEPLOY (main branch push only)
  # ==========================================
  # Backend only. The frontend is deployed by Vercel's own GitHub
  # integration (production from main, previews for branches), not by CI.
  # See docs/DEPLOYMENT.md.
  deploy:
    name: Deploy — Render (Backend)
    needs: [ frontend-ci, backend-ci ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # -- Backend → Render ----------------------------------
      # Trigger a deploy via the Render Deploy Hook URL.
      # Add RENDER_DEPLOY_HOOK_URL to your repo secrets:
      #   Render dashboard → your service → Settings → Deploy Hooks → Create hook
      - name: Trigger Render backend deploy
        run: |
          curl --fail-with-body -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
