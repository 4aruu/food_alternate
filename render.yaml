services:
  # ── Backend Service (FastAPI) ──────────────────────────
  - type: web
    name: food-alternate-backend
    env: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    envVars:
      # Render will provide the PORT automatically.
      # You need to provide the DATABASE_URL in the Render dashboard
      # with your Aiven PostgreSQL connection string:
      # e.g. postgres://avnadmin:password@host:port/defaultdb?sslmode=require
      - key: DATABASE_URL
        sync: false # Set this value manually in the Render dashboard

  # ── Frontend Service (Vite/React Static Site) ──────────
  - type: web
    name: food-alternate-frontend
    env: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/build
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: food-alternate-backend
          property: host
        # Render provides just the domain (e.g., app-name.onrender.com)
        # However, we need the scheme. A known Render trick is to prepend https:// manually if needed, 
        # but often it's safer to just set it manually if it doesn't work out of the box.
        # But we can also set it explicitly:
      - key: VITE_API_BASE_URL
        value: "https://food-alternate-backend.onrender.com" # You may need to update this URL after the backend is created.
        
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
