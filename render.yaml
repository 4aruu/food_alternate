services:
  # ── Backend Service (FastAPI) ──────────────────────────
  - type: web
    name: food-alternate-backend
    env: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    envVars:
      # Render will provide the PORT automatically.
      # You need to provide the DATABASE_URL in the Render dashboard
      # with your Aiven PostgreSQL connection string:
      # e.g. postgres://avnadmin:password@host:port/defaultdb?sslmode=require
      - key: DATABASE_URL
        sync: false # Set this value manually in the Render dashboard

  # ── Frontend Service (Vite/React Static Site) ──────────
  - type: web
    name: food-alternate-frontend
    env: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/build
    envVars:
      # NOTE: was previously declared TWICE (a fromService entry and a
      # literal value) — duplicate YAML keys are invalid/ambiguous, the
      # literal wins. Kept a single explicit entry with the https scheme.
      - key: VITE_API_BASE_URL
        value: "https://food-alternate-backend.onrender.com" # Update if the backend service name differs.

    routes:
      - type: rewrite
        source: /*
        destination: /index.html
